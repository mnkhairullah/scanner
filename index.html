<!DOCTYPE html>
<html lang="id"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Check-in Petugas</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#dfe3e8;--ac:#2563eb;--ok:#16a34a;--wn:#d97706;--er:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--cd:#181b21;--tx:#eceef2;--mu:#9aa1ad;--bd:#2a2f38;--ac:#5b8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 12px}
h1{font-size:18px;margin:0}#stat{font-weight:700;color:var(--ac);white-space:nowrap}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-top:8px}.row>input{flex:1;min-width:0}
input,button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5}
video{width:100%;max-height:280px;border-radius:12px;background:#000;margin-top:8px}
#res{border-radius:12px;padding:18px 12px;text-align:center;color:#fff;margin-bottom:12px}
#res div{font-size:22px;font-weight:700}#res small{display:block;font-size:15px;opacity:.95;margin-top:2px}
#res.ok{background:var(--ok)}#res.wn{background:var(--wn)}#res.er{background:var(--er)}#res.wt{background:var(--mu)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.mu{color:var(--mu);font-size:14px}.err{color:var(--er);font-size:14px;margin-top:6px}
[hidden]{display:none!important}
</style></head><body><div class="w">
<header><h1 id="ev">Check-in</h1><div id="stat"></div></header>

<section id="lock" class="card">
  <b>PIN petugas</b>
  <div class="row"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Masukkan PIN"><button class="p" id="pinB">Masuk</button></div>
  <div id="pinErr" class="err"></div>
</section>

<main id="app" hidden>
  <div class="card">
    <b>Scan / input token</b>
    <div class="row"><input id="ti" placeholder="Token atau hasil scan" autocapitalize="characters" autocomplete="off"><button class="p" id="go">Check-in</button></div>
    <div class="row"><button id="cam">📷 Scan QR</button><button id="ph">📸 Foto QR</button><button id="stop" hidden>Stop</button></div>
    <input id="pf" type="file" accept="image/*" capture="environment" hidden>
    <div class="mu" id="hint" style="margin-top:6px"></div>
    <video id="v" playsinline muted hidden></video>
  </div>

  <div id="res" hidden></div>

  <div class="card">
    <b>Cari nama (tamu lupa QR)</b>
    <div class="row"><input id="q" placeholder="Ketik minimal 2 huruf" autocomplete="off"></div>
    <div id="list"></div>
  </div>

  <div class="card">
    <b>Tamu on the spot</b>
    <div class="row"><input id="wn" placeholder="Nama *" autocomplete="off"></div>
    <div class="row"><input id="wd" placeholder="Divisi" autocomplete="off"><input id="we" type="email" placeholder="Email (opsional)" autocomplete="off"></div>
    <div class="row"><button class="p" id="wB">Daftarkan &amp; check-in</button></div>
  </div>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let PIN = '', busy = false, cool = 0, stream = null, urlDone = false, st;
try { PIN = localStorage.getItem('pin') || ''; } catch (e) {}

// Kosong = halaman ini berjalan DI DALAM Apps Script (kamera langsung diblokir Google di sana).
// Untuk scanner kamera, hosting file ini di luar Apps Script (mis. GitHub Pages) dan isi dengan URL /exec.
const API_URL = 'ISI_URL_EXEC_DI_SINI';
const ACT = { apiStats: 'stats', apiCheckin: 'checkin', apiSearch: 'search', apiWalkin: 'walkin' };
const call = (fn, ...a) => {
  if (!API_URL) return new Promise((ok, no) =>
    google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](PIN, ...a));
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // tanpa preflight CORS
    body: JSON.stringify({ a: ACT[fn], pin: PIN, args: a })
  }).then(r => r.text()).then(t => {
    let j;
    try { j = JSON.parse(t); } catch (e) {
      throw new Error('Server tidak mengembalikan data. Pastikan akses web app = "Anyone" dan sudah deploy versi baru.');
    }
    if (!j.ok) throw new Error(j.error);
    return j.data;
  }).catch(e => {
    if (e && e.name === 'TypeError') throw new Error('Tidak bisa terhubung ke server. Periksa internet, URL /exec, dan akses web app = "Anyone".');
    throw e;
  });
};
function getT(cb) { // token dari link ?t=TOKEN (kamera bawaan HP)
  if (!API_URL && window.google && google.script && google.script.url) {
    google.script.url.getLocation(loc => cb(loc && loc.parameter && loc.parameter.t));
  } else { cb(new URLSearchParams(location.search).get('t')); }
}
function focusTi() { if (matchMedia('(pointer:fine)').matches && !$('#app').hidden) $('#ti').focus(); } // untuk scanner USB
const msg = e => String((e && e.message) || e).replace(/^Error:\s*/, '');
const esc = s => { const i = document.createElement('i'); i.textContent = s; return i.innerHTML; };

function stat(s) {
  if (!s) return;
  if (s.event) { $('#ev').textContent = s.event; }
  $('#stat').textContent = 'Hadir ' + s.hadir + ' / ' + s.total;
}

function res(cls, title, sub) {
  const r = $('#res');
  r.hidden = false; r.className = cls;
  r.innerHTML = '<div>' + esc(title) + '</div><small>' + esc(sub || '') + '</small>';
  if (cls !== 'wt' && navigator.vibrate) navigator.vibrate(cls === 'ok' ? 80 : [120, 60, 120]);
}

function lockScreen(m) {
  stopCam();
  $('#app').hidden = true; $('#lock').hidden = false;
  $('#pinErr').textContent = m || '';
}

function handleErr(e) {
  const m = msg(e);
  if (m.indexOf('PIN') > -1) { lockScreen(m); } else { res('er', 'Gagal', m); }
}

async function enter() {
  try {
    const s = await call('apiStats');
    try { localStorage.setItem('pin', PIN); } catch (e) {}
    $('#lock').hidden = true; $('#app').hidden = false; $('#pinErr').textContent = '';
    stat(s);
    if (!urlDone) { // QR discan dengan kamera bawaan HP: link memuat ?t=TOKEN
      urlDone = true;
      getT(t => { if (t) check(t); });
    }
    focusTi();
  } catch (e) { lockScreen(PIN ? msg(e) : ''); }
}

async function check(raw) {
  if (busy) return;
  busy = true;
  res('wt', 'Memeriksa…');
  try {
    const r = await call('apiCheckin', raw);
    stat(r.stats);
    if (r.status === 'ok') res('ok', '✓ Check-in berhasil', r.nama + (r.divisi ? ' · ' + r.divisi : ''));
    else if (r.status === 'dup') res('wn', '⚠ Sudah check-in', r.nama + ' · pukul ' + r.waktu);
    else res('er', '✗ Tiket tidak ditemukan', r.token || '');
  } catch (e) { handleErr(e); }
  finally { busy = false; focusTi(); }
}

/* Kamera */
function stopCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('#v').hidden = true; $('#stop').hidden = true;
}
$('#stop').onclick = stopCam;
$('#cam').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('#v'); v.srcObject = stream; v.hidden = false; $('#stop').hidden = false;
    await v.play();
    const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
    const loop = () => {
      if (!stream) return;
      if (v.videoWidth && Date.now() > cool && !busy) {
        const k = Math.min(1, 640 / v.videoWidth);
        c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
        x.drawImage(v, 0, 0, c.width, c.height);
        const r = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height,
          { inversionAttempts: 'dontInvert' });
        if (r && r.data) { cool = Date.now() + 2500; check(r.data); }
      }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    stopCam();
    const n = (e && e.name) || '';
    if (n === 'NotAllowedError' || n === 'SecurityError') {
      if (!API_URL) res('wn', 'Kamera diblokir oleh Google', 'Halaman Apps Script tidak boleh memakai kamera langsung. Pakai "Foto QR", kamera bawaan HP, atau buka scanner khusus.');
      else res('wn', 'Izin kamera ditolak', 'Klik ikon gembok di bilah alamat browser, izinkan kamera, lalu coba lagi.');
    } else if (n === 'NotFoundError') {
      res('wn', 'Kamera tidak ditemukan', 'Perangkat ini tidak punya kamera. Pakai scanner USB, input token, atau cari nama.');
    } else {
      res('wn', 'Kamera tidak bisa dibuka', (n ? n + ' · ' : '') + 'Pakai "Foto QR" atau input token.');
    }
  }
};

/* Foto QR: membuka kamera bawaan HP lewat input file, jadi tidak diblokir Google */
const loadImg = f => new Promise((ok, no) => {
  const u = URL.createObjectURL(f), i = new Image();
  i.onload = () => { URL.revokeObjectURL(u); ok(i); };
  i.onerror = () => no(new Error('Foto tidak bisa dibuka'));
  i.src = u;
});
function decode(img) {
  for (const m of [1280, 640]) { // percobaan ke-2 diperkecil: membantu bila layar tamu berpola moire
    const k = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0, w, h);
    const r = jsQR(x.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
    if (r && r.data) return r.data;
  }
  return null;
}
$('#ph').onclick = () => $('#pf').click();
$('#pf').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  res('wt', 'Membaca QR…');
  try {
    const d = decode(await loadImg(f));
    if (d) check(d);
    else res('wn', 'QR tidak terbaca', 'Ulangi foto: dekatkan, pastikan seluruh QR masuk bingkai, dan layar tamu tidak silau.');
  } catch (err) { res('er', 'Gagal membaca foto', msg(err)); }
};

/* Input manual */
$('#go').onclick = () => { const v = $('#ti').value.trim(); if (v) { $('#ti').value = ''; check(v); } };
$('#ti').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };

/* Cari nama */
$('#q').oninput = () => {
  clearTimeout(st);
  st = setTimeout(async () => {
    const q = $('#q').value;
    if (q.trim().length < 2) { $('#list').innerHTML = ''; return; }
    try {
      const L = await call('apiSearch', q);
      $('#list').innerHTML = L.length ? L.map(g =>
        '<div class="it"><div>' + esc(g.nama) + '<div class="mu">' + esc(g.divisi) + '</div></div>' +
        (g.hadir ? '<span class="mu">Sudah hadir</span>' : '<button data-t="' + esc(g.token) + '">Check-in</button>') +
        '</div>').join('') : '<div class="mu" style="margin-top:8px">Tidak ada hasil</div>';
    } catch (e) { handleErr(e); }
  }, 350);
};
$('#list').onclick = e => {
  const t = e.target.dataset && e.target.dataset.t;
  if (t) { check(t).then(() => $('#q').dispatchEvent(new Event('input'))); }
};

/* Tamu on the spot */
$('#wB').onclick = async () => {
  const n = $('#wn').value.trim();
  if (!n) { res('wn', 'Nama wajib diisi'); return; }
  if (busy) return;
  busy = true; res('wt', 'Menyimpan…');
  try {
    const r = await call('apiWalkin', n, $('#wd').value, $('#we').value);
    stat(r.stats);
    res('ok', '✓ Terdaftar & check-in', r.nama + ' · token ' + r.token);
    $('#wn').value = $('#wd').value = $('#we').value = '';
  } catch (e) { handleErr(e); }
  finally { busy = false; }
};

$('#pinB').onclick = () => { PIN = $('#pin').value.trim(); enter(); };
$('#pin').onkeydown = e => { if (e.key === 'Enter') $('#pinB').click(); };
setInterval(() => { if (!$('#app').hidden && !busy) call('apiStats').then(stat).catch(() => {}); }, 30000);
if (!API_URL) $('#hint').textContent = 'Catatan: Google membatasi kamera langsung di halaman ini. Jika "Scan QR" gagal, pakai "Foto QR" atau kamera bawaan HP.';
if (PIN) enter();
</script></body></html>
